<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Registro de Pedidos</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1a1d21;
    --muted: #6b7280;
    --border: #e5e7eb;
    --accent: #9d2088;
    --pendiente-bg: #fff7ed;
    --pendiente-text: #c2410c;
    --cargado-bg: #f0fdf4;
    --cargado-text: #15803d;
    --danger: #dc2626;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: 40px;
  }
  header {
    background: var(--card);
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 {
    font-size: 18px;
    margin: 0;
  }
  header p {
    margin: 2px 0 0;
    font-size: 13px;
    color: var(--muted);
  }
  main {
    max-width: 560px;
    margin: 0 auto;
    padding: 16px;
  }
  .card {
    background: var(--card);
    border-radius: 12px;
    border: 1px solid var(--border);
    padding: 16px;
    margin-bottom: 16px;
  }
  .card h2 {
    font-size: 15px;
    margin: 0 0 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  label {
    display: block;
    font-size: 13px;
    margin-bottom: 4px;
    color: var(--muted);
  }
  input, textarea {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 12px;
    background: #fff;
    color: var(--text);
  }
  input:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
  }
  button {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  button:active { opacity: 0.85; }
  button:disabled { opacity: 0.5; }
  .search-row {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .search-row input { margin-bottom: 0; }
  .filtros {
    display: flex;
    gap: 8px;
    margin-bottom: 4px;
  }
  .filtro-btn {
    flex: 1;
    padding: 8px;
    font-size: 13px;
    font-weight: 500;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #fff;
    color: var(--muted);
    cursor: pointer;
    width: auto;
  }
  .filtro-btn.activo {
    background: var(--text);
    color: #fff;
    border-color: var(--text);
  }
  .pedido {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 10px;
    background: #fff;
  }
  .pedido-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }
  .pedido-cliente {
    font-weight: 600;
    font-size: 15px;
  }
  .pedido-meta {
    font-size: 13px;
    color: var(--muted);
    margin-top: 2px;
  }
  .badge {
    font-size: 12px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .badge.Pendiente { background: var(--pendiente-bg); color: var(--pendiente-text); }
  .badge.Cargado { background: var(--cargado-bg); color: var(--cargado-text); }
  .pedido-notas {
    font-size: 13px;
    color: var(--muted);
    margin-top: 6px;
    font-style: italic;
  }
  .toggle-btn {
    margin-top: 10px;
    width: 100%;
    padding: 10px;
    font-size: 14px;
    background: var(--text);
  }
  .toggle-btn.marcar-pendiente {
    background: #fff;
    color: var(--text);
    border: 1px solid var(--border);
  }
  .estado-msg {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    padding: 24px 0;
  }
  .error-msg {
    background: #fef2f2;
    color: var(--danger);
    border: 1px solid #fecaca;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 12px;
  }
  .ok-msg {
    background: var(--cargado-bg);
    color: var(--cargado-text);
    border: 1px solid #bbf7d0;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 12px;
  }
</style>
</head>
<body>

<header>
  <h1>Registro de Pedidos</h1>
  <p>Anotá el pedido apenas lo hacés. Marcalo "Cargado" cuando lo pases al sistema.</p>
</header>

<main>

  <div class="card">
    <h2>Nuevo pedido</h2>
    <div id="form-msg"></div>
    <label for="cliente">Cliente</label>
    <input type="text" id="cliente" placeholder="Nombre del cliente">

    <label for="cantidad">Cantidad</label>
    <input type="number" id="cantidad" placeholder="0" inputmode="numeric">

    <label for="numeroPedido">N° de pedido</label>
    <input type="text" id="numeroPedido" placeholder="Ej: 1234" inputmode="numeric">

    <label for="notas">Notas (opcional)</label>
    <textarea id="notas" rows="2" placeholder="Detalle, producto, observación..."></textarea>

    <button id="btn-guardar" onclick="guardarPedido()">Guardar pedido</button>
  </div>

  <div class="card">
    <h2>Consultar</h2>
    <div class="search-row">
      <input type="text" id="buscar" placeholder="Buscar por cliente o N° de pedido" oninput="onBuscarInput()">
    </div>
    <div class="filtros">
      <button class="filtro-btn activo" data-estado="" onclick="setFiltro('', this)">Todos</button>
      <button class="filtro-btn" data-estado="Pendiente" onclick="setFiltro('Pendiente', this)">Pendientes</button>
      <button class="filtro-btn" data-estado="Cargado" onclick="setFiltro('Cargado', this)">Cargados</button>
    </div>
  </div>

  <div id="lista"></div>

</main>

<script>
  // Pegar acá la URL que da Apps Script al implementar como Aplicación Web.
  const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzqzo8YgCGx0VXnZbJjogEUtflbm3ZTnGuPUH-VcafescDQOstvd-HjT0ONs86AxaOC/exec';

  let filtroEstado = '';
  let buscarTimeout = null;

  function setFiltro(estado, btn) {
    filtroEstado = estado;
    document.querySelectorAll('.filtro-btn').forEach(b => b.classList.remove('activo'));
    btn.classList.add('activo');
    cargarPedidos();
  }

  function onBuscarInput() {
    clearTimeout(buscarTimeout);
    buscarTimeout = setTimeout(cargarPedidos, 300);
  }

  function formatearFecha(iso) {
    const d = new Date(iso);
    if (isNaN(d)) return iso;
    const hoy = new Date();
    const esHoy = d.toDateString() === hoy.toDateString();
    const hora = d.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
    if (esHoy) return 'Hoy, ' + hora;
    return d.toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit' }) + ', ' + hora;
  }

  async function cargarPedidos() {
    const lista = document.getElementById('lista');
    const q = document.getElementById('buscar').value.trim();
    lista.innerHTML = '<div class="estado-msg">Cargando...</div>';

    try {
      const params = new URLSearchParams();
      if (q) params.set('q', q);
      if (filtroEstado) params.set('estado', filtroEstado);

      const res = await fetch(WEB_APP_URL + '?' + params.toString());
      const data = await res.json();

      if (!data.ok) throw new Error(data.error || 'Error al cargar.');

      if (data.pedidos.length === 0) {
        lista.innerHTML = '<div class="estado-msg">No hay pedidos que coincidan.</div>';
        return;
      }

      lista.innerHTML = data.pedidos.map(renderPedido).join('');
    } catch (err) {
      lista.innerHTML = '<div class="error-msg">No se pudo cargar: ' + err.message + '</div>';
    }
  }

  function renderPedido(p) {
    const esPendiente = p.Estado === 'Pendiente';
    const toggleLabel = esPendiente ? 'Marcar como Cargado' : 'Marcar como Pendiente';
    const toggleClass = esPendiente ? 'toggle-btn' : 'toggle-btn marcar-pendiente';
    const nuevoEstado = esPendiente ? 'Cargado' : 'Pendiente';

    return `
      <div class="pedido">
        <div class="pedido-top">
          <div>
            <div class="pedido-cliente">${escapeHtml(p.Cliente)}</div>
            <div class="pedido-meta">N° ${escapeHtml(String(p.NumeroPedido))} · Cant. ${escapeHtml(String(p.Cantidad))} · ${formatearFecha(p.FechaHora)}</div>
          </div>
          <span class="badge ${p.Estado}">${p.Estado}</span>
        </div>
        ${p.Notas ? '<div class="pedido-notas">' + escapeHtml(p.Notas) + '</div>' : ''}
        <button class="${toggleClass}" onclick="cambiarEstado('${p.ID}', '${nuevoEstado}', this)">${toggleLabel}</button>
      </div>
    `;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  async function cambiarEstado(id, nuevoEstado, btn) {
    btn.disabled = true;
    btn.textContent = 'Guardando...';
    try {
      const res = await fetch(WEB_APP_URL, {
        method: 'POST',
        body: JSON.stringify({ accion: 'cambiarEstado', id: id, estado: nuevoEstado })
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || 'Error al actualizar.');
      cargarPedidos();
    } catch (err) {
      alert('No se pudo actualizar: ' + err.message);
      btn.disabled = false;
    }
  }

  async function guardarPedido() {
    const cliente = document.getElementById('cliente').value.trim();
    const cantidad = document.getElementById('cantidad').value;
    const numeroPedido = document.getElementById('numeroPedido').value.trim();
    const notas = document.getElementById('notas').value.trim();
    const msg = document.getElementById('form-msg');
    const btn = document.getElementById('btn-guardar');

    msg.innerHTML = '';

    if (!cliente || !numeroPedido) {
      msg.innerHTML = '<div class="error-msg">Cliente y N° de pedido son obligatorios.</div>';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Guardando...';

    try {
      const res = await fetch(WEB_APP_URL, {
        method: 'POST',
        body: JSON.stringify({
          accion: 'crear',
          cliente: cliente,
          cantidad: cantidad,
          numeroPedido: numeroPedido,
          notas: notas
        })
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || 'Error al guardar.');

      document.getElementById('cliente').value = '';
      document.getElementById('cantidad').value = '';
      document.getElementById('numeroPedido').value = '';
      document.getElementById('notas').value = '';

      msg.innerHTML = '<div class="ok-msg">Pedido guardado como Pendiente.</div>';
      cargarPedidos();
    } catch (err) {
      msg.innerHTML = '<div class="error-msg">No se pudo guardar: ' + err.message + '</div>';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Guardar pedido';
    }
  }

  cargarPedidos();
</script>

</body>
</html>
